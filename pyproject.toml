[project]
name = "astrbot-plugin-manga-forward"
version = "0.1.4"
description = "AstrBot 漫画整话跨源解析与 OneBot v11 合并转发插件（支持再漫画、拷贝漫画、Komiic）"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
